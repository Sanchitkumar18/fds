# CWRU bearing fault-diagnosis configuration (Case Study 2, Sections 4-6).
# Requires the CWRU drive-end .mat files. See scripts/download_data.py and the
# README for how to obtain them and where to place them. If the raw data is
# absent, scripts/prepare_cwru.py falls back to a documented synthetic stand-in
# so the pipeline still runs end-to-end.
dataset: cwru
task: diagnosis
seed: 42
device: auto

paths:
  raw_dir: data/raw/cwru               # place CWRU .mat files here
  processed_dir: data/processed/cwru
  splits_dir: data/splits/cwru
  checkpoint_dir: checkpoints/cwru
  output_dir: outputs

cwru:
  sampling_rate: 12000                 # 12 kHz drive-end (48 kHz also supported)
  channel: DE                          # drive-end accelerometer
  bearing: SKF-6205
  loads_hp: [0, 1, 2, 3]
  fault_classes: [normal, inner, outer, ball]
  # RPM by load used to compute characteristic frequencies per record.
  rpm_by_load: {0: 1797, 1: 1772, 2: 1750, 3: 1730}
  allow_synthetic_fallback: true       # generate stand-in data if raw missing

preprocess:
  window_size: 2048
  overlap: 0.5
  stft_size: 64
  n_features: 4
  standardize: true

split:
  regime: in_distribution              # in_distribution | cross_condition
  train: 0.70
  val: 0.15
  test: 0.15
  stratify: true
  group_by_record: true                # keep overlapping windows of a record together
  cross_condition:
    train_loads: [0, 1, 2]
    test_loads: [3]

model:
  name: pinn_pdm
  conv_filters: [16, 32, 64]
  lstm_hidden: 128
  lstm_layers: 2
  embed_dim: 128
  head_dim: 64
  dropout: 0.3
  seq_len: 1

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0
  optimizer: adam
  scheduler: cosine
  early_stopping_patience: 8
  grad_clip: 5.0
  num_workers: 0

physics:
  lambda_phys: 0.0            # diagnosis task: no degradation ODE
  lambda_mono: 0.0
  lambda_spec: 0.5           # spectral defect-frequency consistency
  adaptive: true
  adaptive_method: gradnorm
  adaptive_alpha: 0.12
  spec_bandwidth: 40.0
  n_harmonics: 3
